<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Students | Campus</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #788197;
        --line: #e8ebf2;
        --surface: #fff;
        --background: #f5f7fb;
        --primary: #5546e8;
        --primary-dark: #4335c5;
        --danger: #c83d54;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--ink);
      }

      button, input { font: inherit; }
      button { cursor: pointer; }

      .layout { min-height: 100vh; }

      .topbar {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 max(24px, calc((100% - 1120px) / 2));
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .brand { display: flex; align-items: center; gap: 11px; font-weight: 750; letter-spacing: -.3px; }
      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 11px;
        background: #eeecff;
        color: var(--primary);
        font-size: 19px;
      }

      .top-note { color: var(--muted); font-size: 13px; }
      main { width: min(1120px, calc(100% - 48px)); margin: 46px auto 64px; }
      .eyebrow { margin: 0 0 9px; color: var(--primary); font-size: 12px; font-weight: 750; letter-spacing: 1.2px; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(29px, 4vw, 38px); letter-spacing: -1.4px; }
      .intro { margin: 9px 0 29px; color: var(--muted); font-size: 15px; }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
      .stat, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 5px 20px rgb(28 39 75 / 3%); }
      .stat { display: flex; align-items: center; gap: 14px; padding: 18px 20px; }
      .stat-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px; background: #f0efff; color: var(--primary); font-size: 20px; }
      .stat-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 12px; }
      .stat-value { font-size: 19px; font-weight: 750; }

      .content { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(285px, .85fr); gap: 20px; align-items: start; }
      .panel { overflow: hidden; }
      .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
      .panel-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.25px; }
      .count { color: var(--muted); font-size: 12px; }
      .student-list { padding: 3px 22px; }
      .student { display: flex; align-items: center; gap: 13px; padding: 17px 0; border-bottom: 1px solid var(--line); }
      .student:last-child { border-bottom: 0; }
      .avatar { display: grid; flex: 0 0 42px; width: 42px; height: 42px; place-items: center; border-radius: 14px; background: #eeecff; color: var(--primary); font-size: 14px; font-weight: 750; }
      .student-info { min-width: 0; flex: 1; }
      .student-name { overflow: hidden; margin: 0 0 4px; font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .student-meta { overflow: hidden; margin: 0; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .student-course { color: #5950b9; font-weight: 650; }
      .actions { display: flex; gap: 6px; }
      .icon-button { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--muted); }
      .icon-button:hover { background: #f2f3f8; color: var(--ink); }
      .icon-button.delete:hover { background: #fff0f2; color: var(--danger); }

      .form-panel { padding-bottom: 21px; }
      .form-panel .panel-heading { margin-bottom: 18px; }
      form { padding: 0 20px; }
      .field { margin-bottom: 15px; }
      label { display: block; margin-bottom: 7px; color: #424a5d; font-size: 12px; font-weight: 650; }
      input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #dfe3ec; border-radius: 9px; outline: none; background: white; color: var(--ink); font-size: 13px; }
      input::placeholder { color: #a7adbb; }
      input:focus { border-color: #8d83f2; box-shadow: 0 0 0 3px rgb(85 70 232 / 10%); }
      .form-actions { display: flex; gap: 9px; margin-top: 20px; }
      .button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 9px; font-size: 13px; font-weight: 700; }
      .button-primary { flex: 1; background: var(--primary); color: white; }
      .button-primary:hover { background: var(--primary-dark); }
      .button-secondary { background: #f0f1f6; color: #535b6e; }
      .button-secondary:hover { background: #e7e9f1; }
      .message { min-height: 16px; margin: 12px 0 0; color: var(--danger); font-size: 12px; }
      .empty { padding: 44px 20px; color: var(--muted); text-align: center; font-size: 13px; }
      .empty-icon { margin-bottom: 10px; font-size: 27px; }
      .loading { padding: 32px 20px; color: var(--muted); text-align: center; font-size: 13px; }

      @media (max-width: 760px) {
        main { margin-top: 34px; }
        .content { grid-template-columns: 1fr; }
        .form-panel { grid-row: 1; }
      }

      @media (max-width: 520px) {
        .topbar { height: 62px; padding: 0 18px; }
        .top-note { font-size: 11px; }
        main { width: calc(100% - 32px); margin-top: 30px; }
        .stats { gap: 9px; }
        .stat { gap: 8px; padding: 13px 10px; }
        .stat-icon { width: 34px; height: 34px; font-size: 17px; }
        .stat-label { font-size: 10px; }
        .stat-value { font-size: 16px; }
        .panel-heading { padding: 17px; }
        .student-list { padding: 3px 16px; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>Campus</span></div>
        <span class="top-note">Student Management</span>
      </header>

      <main>
        <p class="eyebrow">Overview</p>
        <h1>Students</h1>
        <p class="intro">Manage your student records in one place.</p>

        <section class="stats" aria-label="Student summary">
          <div class="stat"><span class="stat-icon" aria-hidden="true">♙</span><span><span class="stat-label">Total students</span><strong class="stat-value" id="total-count">0</strong></span></div>
          <div class="stat"><span class="stat-icon" aria-hidden="true">▤</span><span><span class="stat-label">Courses</span><strong class="stat-value" id="course-count">0</strong></span></div>
          <div class="stat"><span class="stat-icon" aria-hidden="true">◷</span><span><span class="stat-label">Average age</span><strong class="stat-value" id="average-age">—</strong></span></div>
        </section>

        <section class="content">
          <section class="panel" aria-labelledby="student-list-title">
            <div class="panel-heading">
              <h2 id="student-list-title">All students</h2>
              <span class="count" id="list-count">Loading...</span>
            </div>
            <div class="student-list" id="student-list" aria-live="polite">
              <div class="loading">Loading students...</div>
            </div>
          </section>

          <section class="panel form-panel" aria-labelledby="form-title">
            <div class="panel-heading"><h2 id="form-title">Add a student</h2></div>
            <form id="student-form">
              <div class="field"><label for="name">Full name</label><input id="name" name="name" placeholder="e.g. Alex Morgan" required></div>
              <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="alex@example.com" required></div>
              <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="1" max="120" placeholder="e.g. 20" required></div>
              <div class="field"><label for="course">Course</label><input id="course" name="course" placeholder="e.g. Computer Science" required></div>
              <div class="form-actions">
                <button class="button button-primary" id="submit-button" type="submit">Add student</button>
                <button class="button button-secondary" id="cancel-button" type="button" hidden>Cancel</button>
              </div>
              <p class="message" id="form-message" role="alert"></p>
            </form>
          </section>
        </section>
      </main>
    </div>

    <script>
      const studentsUrl = '/api/students';
      const studentList = document.querySelector('#student-list');
      const form = document.querySelector('#student-form');
      const formTitle = document.querySelector('#form-title');
      const submitButton = document.querySelector('#submit-button');
      const cancelButton = document.querySelector('#cancel-button');
      const formMessage = document.querySelector('#form-message');
      let students = [];
      let editingId = null;

      async function request(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || result.errors?.join(' ') || `Request failed (${response.status}).`);
        }
        return response.status === 204 ? null : response.json();
      }

      function initials(name) {
        return name.split(/\s+/).slice(0, 2).map((part) => part[0] || '').join('').toUpperCase();
      }

      function renderStudents() {
        const courses = new Set(students.map((student) => student.course));
        const averageAge = students.length
          ? Math.round(students.reduce((total, student) => total + student.age, 0) / students.length)
          : null;
        document.querySelector('#total-count').textContent = students.length;
        document.querySelector('#course-count').textContent = courses.size;
        document.querySelector('#average-age').textContent = averageAge ?? '—';
        document.querySelector('#list-count').textContent = `${students.length} ${students.length === 1 ? 'record' : 'records'}`;

        if (students.length === 0) {
          studentList.innerHTML = '<div class="empty"><div class="empty-icon" aria-hidden="true">♙</div>No students yet. Add your first student to get started.</div>';
          return;
        }

        studentList.replaceChildren(...students.map((student) => {
          const row = document.createElement('article');
          row.className = 'student';

          const avatar = document.createElement('div');
          avatar.className = 'avatar';
          avatar.setAttribute('aria-hidden', 'true');
          avatar.textContent = initials(student.name);

          const info = document.createElement('div');
          info.className = 'student-info';
          const name = document.createElement('p');
          name.className = 'student-name';
          name.textContent = student.name;
          const details = document.createElement('p');
          details.className = 'student-meta';
          details.textContent = `${student.email} · ${student.age} years · `;
          const course = document.createElement('span');
          course.className = 'student-course';
          course.textContent = student.course;
          details.append(course);
          info.append(name, details);

          const actions = document.createElement('div');
          actions.className = 'actions';
          const editButton = document.createElement('button');
          editButton.className = 'icon-button';
          editButton.type = 'button';
          editButton.setAttribute('aria-label', `Edit ${student.name}`);
          editButton.title = 'Edit student';
          editButton.textContent = '✎';
          editButton.addEventListener('click', () => editStudent(student));

          const deleteButton = document.createElement('button');
          deleteButton.className = 'icon-button delete';
          deleteButton.type = 'button';
          deleteButton.setAttribute('aria-label', `Delete ${student.name}`);
          deleteButton.title = 'Delete student';
          deleteButton.textContent = '×';
          deleteButton.addEventListener('click', () => deleteStudent(student));
          actions.append(editButton, deleteButton);
          row.append(avatar, info, actions);
          return row;
        }));
      }

      async function loadStudents() {
        try {
          students = await request(studentsUrl);
          renderStudents();
        } catch (error) {
          studentList.replaceChildren();
          const message = document.createElement('div');
          message.className = 'empty';
          message.textContent = `Could not load students: ${error.message}`;
          studentList.append(message);
          document.querySelector('#list-count').textContent = 'Unavailable';
        }
      }

      function resetForm() {
        editingId = null;
        form.reset();
        formTitle.textContent = 'Add a student';
        submitButton.textContent = 'Add student';
        cancelButton.hidden = true;
        formMessage.textContent = '';
      }

      function editStudent(student) {
        editingId = student.id;
        form.elements.name.value = student.name;
        form.elements.email.value = student.email;
        form.elements.age.value = student.age;
        form.elements.course.value = student.course;
        formTitle.textContent = 'Edit student';
        submitButton.textContent = 'Save changes';
        cancelButton.hidden = false;
        formMessage.textContent = '';
        form.elements.name.focus();
        document.querySelector('.form-panel').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      async function deleteStudent(student) {
        if (!window.confirm(`Delete ${student.name}? This cannot be undone.`)) return;
        try {
          await request(`${studentsUrl}/${encodeURIComponent(student.id)}`, { method: 'DELETE' });
          if (editingId === student.id) resetForm();
          await loadStudents();
        } catch (error) {
          window.alert(`Could not delete student: ${error.message}`);
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        formMessage.textContent = '';
        const body = {
          name: form.elements.name.value,
          email: form.elements.email.value,
          age: Number(form.elements.age.value),
          course: form.elements.course.value,
        };
        const url = editingId
          ? `${studentsUrl}/${encodeURIComponent(editingId)}`
          : studentsUrl;

        try {
          await request(url, {
            method: editingId ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          resetForm();
          await loadStudents();
        } catch (error) {
          formMessage.textContent = error.message;
        }
      });

      cancelButton.addEventListener('click', resetForm);
      loadStudents();
    </script>
  </body>
</html>
